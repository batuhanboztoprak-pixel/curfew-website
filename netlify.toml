# Plain static site — no build step. Netlify publishes the repo root as-is.
[build]
  publish = "."

# ---------------------------------------------------------------------------
# Placeholder link. Every "Download on the App Store" button on the site
# points at /download, so the real App Store URL only needs to be set once,
# here.
# ---------------------------------------------------------------------------

# TODO: replace with the real App Store listing once it's live, e.g.
#   to = "https://apps.apple.com/app/curfew/id0000000000"
# Until then it sends people back to the download section of the home page.
[[redirects]]
  from = "/download"
  to = "/#download"
  status = 302

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
